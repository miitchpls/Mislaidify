<div class="dashboard">
  <div class="header">
    <img class="h-8" src="assets/logo.svg" alt="Mislaidify" />
    <div class="propic-wrapper">
      <div class="propic skeleton"></div>
    </div>
  </div>

  <div class="container">
    <div class="content">
      <div class="welcome">
        Welcome <span class="skeleton rounded-lg inline-block align-middle w-32 h-7"></span>
      </div>

      <div class="columns">
        <div class="column">
          <div class="title">Your Playlists</div>

          <div class="playlist-grid p-4">
            <div *ngFor="let i of [1,2,3,4,5,6,7,8]">
              <playlist-card-skeleton></playlist-card-skeleton>
            </div>
          </div>
        </div>

        <div class="column">
          <div class="title">Your Songs</div>

          <div class="tracks-wrapper">
            <div class="tracks">
              <track-card-skeleton *ngFor="let i of [1,2,3,4,5,6,7,8]"></track-card-skeleton>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
