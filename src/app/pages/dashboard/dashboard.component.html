<div class="dashboard">
  <div class="header">
    <img class="h-8" src="assets/logo.svg" alt="Mislaidify" />
    <div class="propic-wrapper">
      <div class="propic cursor-pointer" [class.skeleton]="!userProfile?.images?.length" (click)="showProfileMenu = !showProfileMenu">
        <img *ngIf="userProfile?.images?.length" [src]="userProfile!.images![0].url" [alt]="userProfile!.id" />
      </div>
      <div class="profile-menu" *ngIf="showProfileMenu">
        <button (click)="logout()">Logout</button>
      </div>
      <div class="overlay" *ngIf="showProfileMenu" (click)="showProfileMenu = false"></div>
    </div>
  </div>

  <div class="container">
    <div class="content">
      <div class="welcome">
        Welcome
        <span *ngIf="userProfile?.display_name; else nameSkeleton">{{ userProfile!.display_name }}</span>
        <ng-template #nameSkeleton><span class="skeleton rounded-lg inline-block align-middle w-32 h-7"></span></ng-template>
      </div>

      <div class="columns">
        <div class="column">
          <div class="title">Your Playlists</div>

          <div class="playlist-grid p-4">
            <div *ngFor="let i of [1,2,3,4,5,6,7,8]">
              <playlist-card-skeleton></playlist-card-skeleton>
            </div>
          </div>
        </div>

        <div class="column">
          <div class="title">Your Songs</div>

          <div class="tracks-wrapper">
            <div class="tracks">
              <track-card-skeleton *ngFor="let i of [1,2,3,4,5,6,7,8]"></track-card-skeleton>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
