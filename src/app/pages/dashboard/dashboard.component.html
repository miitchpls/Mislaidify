<div class="dashboard">
  <div class="header">
    <img class="h-8" src="assets/logo.svg" alt="Mislaidify" />
    <div class="propic-wrapper">
      <div class="propic cursor-pointer" [class.skeleton]="!userProfile?.images?.length"
        (click)="showProfileMenu = !showProfileMenu">
        <img *ngIf="userProfile?.images?.length" [src]="userProfile!.images![0].url" [alt]="userProfile!.id" />
      </div>
      <div class="profile-menu" *ngIf="showProfileMenu">
        <button (click)="logout()">Logout</button>
      </div>
      <div class="overlay" *ngIf="showProfileMenu" (click)="showProfileMenu = false"></div>
    </div>
  </div>

  <div class="container">
    <div class="content">
      <div class="welcome">
        Welcome
        <span *ngIf="userProfile?.display_name; else nameSkeleton">{{ userProfile!.display_name }}</span>
        <ng-template #nameSkeleton><span
            class="skeleton rounded-lg inline-block align-middle w-32 h-7"></span></ng-template>
      </div>

      <div class="columns">
        <div class="column">
          <div class="title">Your Playlists</div>

          <div class="playlist-grid p-4">
            <ng-container *ngIf="playlists; else playlistSkeletons">
              <all-playlists-card [selected]="allSelected" (hasClicked)="toggleAll()"></all-playlists-card>
              <playlist-card *ngFor="let playlist of playlists" [playlist]="playlist"
                [class.selected]="selectedPlaylistIds.has(playlist.id)"
                (hasClicked)="togglePlaylist($event)"></playlist-card>
            </ng-container>
            <ng-template #playlistSkeletons>
              <playlist-card-skeleton *ngFor="let i of [1,2,3,4,5,6,7,8]"></playlist-card-skeleton>
            </ng-template>
          </div>
        </div>

        <div class="column">
          <div class="title">Mislaid tracks</div>

          <ng-container [ngSwitch]="selectedPlaylistIds.size !== 0">
            <div class="tracks-wrapper" *ngSwitchCase="true">
              <div class="tracks" #tracksContainer>
                <ng-container *ngIf="mislaidTracks?.length; else trackSkeletons">
                  <track-card *ngFor="let track of mislaidTracks" [track]="track"></track-card>
                </ng-container>
                <ng-template #trackSkeletons>
                  <track-card-skeleton *ngFor="let i of [1,2,3,4,5,6,7,8]"></track-card-skeleton>
                </ng-template>
              </div>
            </div>

            <div class="suggestion" *ngSwitchDefault>
              <div>
                <div class="main-info">
                  <p><span>Select playlists</span> to find songs not in them yet.</p>
                </div>
                <div class="sub-info">
                  <p>We compare your saved songs with the playlist you select and show you the ones that haven't been
                  added.</p>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
