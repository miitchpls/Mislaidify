<div class="modal-backdrop" (click)="close.emit()"></div>

<div class="modal-box" *ngIf="isSinglePlaylist">
  <div class="modal-header">
    <span class="modal-title">Add to Playlist</span>
  </div>
  <div class="modal-summary">
    <span class="track-badge">{{ selectedTrackIds.size }}</span>
    <span class="summary-text">
      {{ selectedTrackIds.size === 1 ? 'track' : 'tracks' }} &rarr; <strong>{{ playlists[0].name }}</strong>
    </span>
  </div>
  <div class="modal-actions">
    <button (click)="close.emit()">Cancel</button>
    <button class="confirm" [disabled]="isAddingTracks" (click)="onConfirm()">
      {{ isAddingTracks ? 'Adding...' : 'Add' }}
    </button>
  </div>
</div>

<div class="modal-box" *ngIf="!isSinglePlaylist">
  <div class="modal-header">
    <span class="modal-title">Add to Playlist</span>
    <span class="modal-subtitle">
      <span class="track-badge">{{ selectedTrackIds.size }}</span>
      {{ selectedTrackIds.size === 1 ? 'track' : 'tracks' }} selected
    </span>
  </div>
  <input class="search-bar focus-ring-secondary" type="text" placeholder="Search playlists..." [(ngModel)]="searchQuery" />

  <div class="playlist-picker">
    <div *ngFor="let playlist of filteredPlaylists" class="picker-item hover-surface-subtle" [class.picked]="targetPlaylistIds.has(playlist.id)"
      (click)="toggleTargetPlaylist(playlist.id)">
      <checkbox [checked]="targetPlaylistIds.has(playlist.id)"></checkbox>
      <img *ngIf="playlist.images[0]?.url; else noImage" class="playlist-cover" [src]="playlist.images[0].url" [alt]="playlist.name" />
      <ng-template #noImage><div class="playlist-cover playlist-cover--empty"></div></ng-template>
      <span>{{ playlist.name }}</span>
    </div>
  </div>
  <div class="modal-actions">
    <button class="select-all-btn" (click)="toggleAllPlaylists()">
      {{ allPlaylistsSelected ? 'Deselect all' : 'Select all' }}
    </button>
    <div class="modal-actions-right">
      <button (click)="close.emit()">Cancel</button>
      <button class="confirm" [disabled]="isAddingTracks || targetPlaylistIds.size === 0" (click)="onConfirm()">
        {{ isAddingTracks ? 'Adding...' : 'Add' }}
      </button>
    </div>
  </div>
</div>
