name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-bump-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check if version was manually bumped
        id: check_version
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            BEFORE_VERSION=$(git show "$BEFORE":package.json | jq -r '.version')
            CURRENT_VERSION=$(jq -r '.version' package.json)
            if [ "$BEFORE_VERSION" != "$CURRENT_VERSION" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump patch version
        if: github.event_name == 'push' && steps.check_version.outputs.skip == 'false'
        run: |
          npm version patch --no-git-tag-version
          npm install --package-lock-only

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit, tag and push
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(jq -r '.version' package.json)
          if [ "${{ steps.check_version.outputs.skip }}" == "false" ]; then
            git add package.json package-lock.json
            git commit -m "chore: bump version to $VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --follow-tags
